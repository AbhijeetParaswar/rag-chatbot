version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-chatbot-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - DATABASE_URL=sqlite+aiosqlite:////app/data/rag_chatbot.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-chatbot-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
